<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Profil-Mock</title>
<style>
:root{
  --bg:#f4f2ee; --card:#fff; --nav:#fff; --text:rgba(0,0,0,.9); --muted:rgba(0,0,0,.6); --faint:rgba(0,0,0,.45);
  --line:rgba(140,140,140,.2); --shadow:0 0 0 1px rgba(140,140,140,.2); --hover:rgba(0,0,0,.08);
  --blue:#0a66c2; --blue-h:#004182; --on-blue:#fff; --green:#01754f; --otw:#e6f4ea; --otw-ring:#57a55a;
  --gold:#915907; --badge:#cb112d; --input:#edf3f8; --chip:#e8e8e8; --edit:#fff8d6; --edit-line:#e7b416;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#1b1f23; --nav:#1d2226; --text:rgba(255,255,255,.9); --muted:rgba(255,255,255,.6); --faint:rgba(255,255,255,.45);
    --line:rgba(255,255,255,.15); --shadow:0 0 0 1px rgba(255,255,255,.12); --hover:rgba(255,255,255,.08);
    --blue:#71b7fb; --blue-h:#a8d4ff; --on-blue:#000; --green:#5fc198; --otw:#1f3a2b; --otw-ring:#57a55a;
    --gold:#e7a33e; --input:#38434f; --chip:#38434f; --edit:#3a3317; --edit-line:#e7b416;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --card:#1b1f23; --nav:#1d2226; --text:rgba(255,255,255,.9); --muted:rgba(255,255,255,.6); --faint:rgba(255,255,255,.45);
  --line:rgba(255,255,255,.15); --shadow:0 0 0 1px rgba(255,255,255,.12); --hover:rgba(255,255,255,.08);
  --blue:#71b7fb; --blue-h:#a8d4ff; --on-blue:#000; --green:#5fc198; --otw:#1f3a2b; --otw-ring:#57a55a;
  --gold:#e7a33e; --input:#38434f; --chip:#38434f; --edit:#3a3317; --edit-line:#e7b416;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.42857 -apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Fira Sans",Ubuntu,Oxygen,"Oxygen Sans",Cantarell,"Droid Sans","Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Lucida Grande",Helvetica,Arial,sans-serif;}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block;flex:none}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,p{margin:0}

/* ---------- Global nav ---------- */
.nav{position:sticky;top:0;z-index:50;background:var(--nav);border-bottom:1px solid var(--line)}
.nav-in{max-width:1128px;margin:0 auto;height:52px;display:flex;align-items:center;padding:0 16px;gap:8px}
.logo{width:34px;height:34px;border-radius:4px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font:700 22px/1 Arial,sans-serif;letter-spacing:-1px;flex:none}
.search{display:flex;align-items:center;gap:8px;background:var(--input);border-radius:4px;height:34px;padding:0 10px;width:280px;color:var(--muted);margin-right:auto}
.search input{border:0;background:none;outline:0;font:inherit;color:var(--text);width:100%}
.navlist{display:flex;align-items:stretch;height:52px}
.navitem{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:80px;color:var(--muted);font-size:12px;position:relative;cursor:pointer}
.navitem:hover{color:var(--text)}
.navitem.active{color:var(--text)}
.navitem.active::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--text)}
.navitem .ic{position:relative}
.navbadge{position:absolute;top:-4px;right:-8px;background:var(--badge);color:#fff;font-size:11px;font-weight:600;border-radius:9px;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center;border:2px solid var(--nav)}
.navsep{width:1px;background:var(--line);margin:0 8px}
.nav-me .mini{width:24px;height:24px;border-radius:50%}
.premium{color:var(--gold);text-decoration:underline;font-size:12px;text-align:center;line-height:1.2;max-width:84px}

/* ---------- Layout ---------- */
.wrap{max-width:1128px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}
main{display:flex;flex-direction:column;gap:8px;min-width:0}
aside{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--card);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.pad{padding:24px 24px 12px}
.sec-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.sec-h h2{font-size:20px;font-weight:600;line-height:1.4}
.sec-sub{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:4px;margin-bottom:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.sec-foot{display:flex;align-items:center;justify-content:center;gap:6px;border-top:1px solid var(--line);padding:12px;color:var(--muted);font-weight:600;font-size:16px;width:100%}
.sec-foot:hover{background:var(--hover);color:var(--text)}

/* ---------- Top card ---------- */
.banner{height:0;padding-bottom:25%;background:linear-gradient(135deg,#a0b4b7 0%,#c8d6d9 55%,#dfe8ea 100%) center/cover no-repeat;position:relative}
.top-body{padding:0 24px 24px;position:relative}
.avatar-wrap{width:160px;height:160px;border-radius:50%;border:4px solid var(--card);margin-top:-112px;position:relative;background:var(--card);overflow:hidden}
.avatar-wrap img,.avatar-wrap .ghost{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.ghost{background:#9db3c8;display:grid!important;place-items:end center;overflow:hidden}
.otw .otw-ring{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 150deg,var(--otw-ring) 0 120deg,transparent 120deg);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
.otw-label{position:absolute;bottom:14px;left:50%;transform:translateX(-50%) rotate(0);font-size:11px;font-weight:700;color:#fff;letter-spacing:.3px;text-shadow:0 0 2px rgba(0,0,0,.4);pointer-events:none;white-space:nowrap}
.top-pencil{position:absolute;right:16px;top:12px}
.top-cam{position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:50%;background:var(--card);color:var(--blue);display:grid;place-items:center;z-index:2}
.top-grid{display:grid;grid-template-columns:minmax(0,1fr) 232px;gap:24px;margin-top:8px}
.name-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.name-row h1{font-size:24px;font-weight:600;line-height:1.25}
.verified{color:var(--muted)}
.pronouns{color:var(--muted);font-size:14px}
.headline{font-size:16px;line-height:1.5;margin-top:2px}
.loc{color:var(--muted);margin-top:8px}
.link{color:var(--blue);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}
.web{margin-top:4px;display:flex;align-items:center;gap:4px}
.conn{margin-top:8px;color:var(--muted)}
.conn b{color:var(--blue);font-weight:600}
.orgs li{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:8px;line-height:1.3}
.orgs li:hover{color:var(--blue);text-decoration:underline;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{height:32px;padding:0 16px;border-radius:16px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pill.primary{background:var(--blue);color:var(--on-blue)}
.pill.primary:hover{background:var(--blue-h)}
.pill.secondary{box-shadow:inset 0 0 0 1px var(--blue);color:var(--blue)}
.pill.secondary:hover{box-shadow:inset 0 0 0 2px var(--blue);background:rgba(10,102,194,.06)}
.pill.tertiary{box-shadow:inset 0 0 0 1px var(--muted);color:var(--muted)}
.pill.tertiary:hover{box-shadow:inset 0 0 0 2px var(--text);color:var(--text);background:var(--hover)}
.pill.sm{height:32px;font-size:14px;padding:0 14px}
.otw-box{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.otw-card{border-radius:8px;padding:12px 16px;position:relative;font-size:14px}
.otw-card.a{background:var(--otw)}
.otw-card.b{box-shadow:inset 0 0 0 1px var(--line)}
.otw-card b{display:block;font-weight:600}
.otw-card .link{display:inline-block;margin-top:2px}

/* ---------- Generic items ---------- */
.muted{color:var(--muted)}
.lock{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.analytics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 12px}
.ana{display:flex;gap:8px;padding:4px 0}
.ana b{display:block;font-weight:600}
.ana span{color:var(--muted);font-size:14px}
.ml{white-space:pre-wrap;word-wrap:break-word}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.clamp.open{display:block;-webkit-line-clamp:unset}
.more{color:var(--muted);font-weight:600;display:block;margin-left:auto;margin-top:2px}
.more:hover{color:var(--blue);text-decoration:underline}
.about-text{font-size:14px;margin-bottom:12px}
.top-skills{box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.top-skills b{font-weight:600;display:block}

.list > li{display:flex;gap:8px;padding:12px 0;position:relative}
.list > li + li{border-top:1px solid var(--line)}
.logo-sq{border-radius:4px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;overflow:hidden}
.item-body{flex:1;min-width:0}
.t1{font-weight:600;font-size:14px}
.t2{font-size:14px}
.t3{color:var(--muted);font-size:14px}
.desc{margin-top:8px;font-size:14px}
.skillline{margin-top:8px;display:flex;gap:6px;align-items:flex-start;font-size:14px}
.skillline b{font-weight:600}
.media{margin-top:8px;display:flex;gap:8px;align-items:center;font-size:14px}
.media-thumb{width:112px;height:64px;border-radius:4px;background:var(--chip);flex:none;overflow:hidden}
.media-thumb img{width:100%;height:100%;object-fit:cover}

.featured{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:8px;overflow-x:auto;padding-bottom:16px;scrollbar-width:thin}
.feat{box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;position:relative;min-width:0}
.feat-img{height:130px;background-color:var(--chip);background-position:center;background-size:cover;display:grid;place-items:center;color:var(--muted);font-size:12px;position:relative}
.feat-b{padding:12px}
.feat-kind{color:var(--muted);font-size:12px}
.feat-t{font-weight:600;margin-top:2px}
.feat-x{color:var(--muted);font-size:12px;margin-top:4px}

.posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-bottom:12px}
.post{box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.post-h{display:flex;gap:8px;align-items:center}
.post-h .mini{width:32px;height:32px;border-radius:50%;flex:none;overflow:hidden}
.post-n{font-weight:600;font-size:12px;line-height:1.3}
.post-t{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:3px}
.post-f{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.reacts{display:flex;align-items:center;gap:4px}
.reacts i{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:9px;margin-right:-6px;border:1px solid var(--card)}
.reacts i:last-of-type{margin-right:2px}
.tabs{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.tab{height:32px;padding:0 12px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--muted);color:var(--muted);font-weight:600;display:inline-flex;align-items:center}
.tab.on{background:var(--green);color:#fff;box-shadow:none}
.follow{margin-top:-2px;margin-bottom:8px}

.skills > li{display:block}
.skill-n{font-weight:600}
.endorse{display:flex;gap:6px;align-items:center;color:var(--muted);margin-top:6px}

.reco > li{align-items:flex-start}
.avatar-s{display:block;align-self:flex-start;width:56px;height:56px;border-radius:50%;flex:none;overflow:hidden}

.people > li{border-top:0!important;padding:8px 0}
.people .avatar-s{width:48px;height:48px;border-radius:50%;flex:none;overflow:hidden}
.people .pill{margin-top:8px}
.editing .people > li.has-ctrls{flex-wrap:wrap;padding-right:0}
.people .ctrls{position:static;margin-left:56px;box-shadow:none}

.side-card{padding:16px}
.side-row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.side-row + .side-row{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.side-row b{font-weight:600;font-size:16px;display:block}
.side-card h3{font-size:16px;font-weight:600}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:16px 8px;line-height:1.9}
.foot span{margin:0 6px;white-space:nowrap;display:inline-block}
.foot .logo-t{font-weight:700;color:var(--blue)}
.ad{padding:12px 16px;text-align:center;font-size:12px;color:var(--muted)}
.ad-in{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0}

/* ---------- Edit mode ---------- */
.editing [data-path]{outline:1px dashed var(--edit-line);outline-offset:1px;border-radius:2px;background:var(--edit);min-width:24px;display:inline-block;cursor:text}
.editing div[data-path],.editing p[data-path]{display:block}
.editing [data-path]:focus{outline:2px solid var(--edit-line)}
.editing [data-path]:empty::before{content:attr(data-ph);color:var(--faint)}
.editing .clamp{display:block;-webkit-line-clamp:unset}
.editing .more{display:none}
.editing [data-img]{cursor:pointer}
.img-hint{position:absolute;inset:auto 8px 8px auto;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:4px 8px;border-radius:4px;pointer-events:none;z-index:3}
.avatar-wrap .img-hint{inset:auto 50% 40% auto;transform:translateX(50%);white-space:nowrap}
.ctrls{display:none;gap:2px;position:absolute;top:8px;right:0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:2px;z-index:4}
.editing .ctrls{display:flex}
.ctrls button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.ctrls button:hover{background:var(--hover);color:var(--text)}
.ctrls button.del:hover{color:#cb112d}
.editing .has-ctrls{padding-right:100px}
.add-btn{display:none}
.editing .add-btn{display:grid}
body:not(.editing) .edit-only{display:none!important}
.edit-opts{display:none;flex-wrap:wrap;gap:16px;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--edit);box-shadow:inset 0 0 0 1px var(--edit-line);font-size:13px}
.editing .edit-opts{display:flex}
.edit-opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.dates{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0;font-size:13px}
.dates input[type=month]{font:inherit;color:var(--text);background:var(--edit);border:1px dashed var(--edit-line);border-radius:4px;padding:2px 4px;color-scheme:light dark}
.hidden-sec{opacity:.45}
.sec-toggle{font-size:12px;display:inline-flex;gap:4px;align-items:center;color:var(--muted);margin-right:4px;white-space:nowrap}

/* ---------- Toolbar & modal ---------- */
.dock{position:fixed;right:16px;bottom:16px;z-index:80;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.dock-menu{display:none;background:var(--card);box-shadow:0 4px 24px rgba(0,0,0,.2),var(--shadow);border-radius:8px;padding:6px;min-width:220px}
.dock.open .dock-menu{display:block}
.dock-menu button,.dock-menu label{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:6px;text-align:left;cursor:pointer}
.dock-menu button:hover,.dock-menu label:hover{background:var(--hover)}
.dock-menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.dock-main{display:flex;gap:8px}
.fab{height:44px;padding:0 18px;border-radius:22px;background:var(--blue);color:var(--on-blue);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fab.alt{background:var(--card);color:var(--text);padding:0;width:44px;justify-content:center}
.editing-flag .fab.main{background:#e7b416;color:#000}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2226;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:none;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto}
.modal-bg.on{display:flex}
.modal{background:var(--card);border-radius:8px;width:100%;max-width:552px;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 12px 24px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:20px;font-weight:400}
.modal-b{padding:16px 24px 24px}
.ci{display:flex;gap:16px;padding:10px 0}
.ci b{display:block;font-weight:600;font-size:16px}
.ci .v{color:var(--blue)}

/* ---------- Responsive ---------- */
@media (max-width:1000px){ .navitem .lbl{display:none} .navitem{min-width:56px} .premium{display:none} }
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);margin-top:0;padding:0}
  .card{border-radius:0}
  .top-grid{grid-template-columns:minmax(0,1fr)}
  .orgs{display:none}
  .search{width:auto;flex:1}
  .navitem.hide-sm,.navsep,.biz{display:none}
}
@media (max-width:560px){
  .pad{padding:16px 16px 8px}
  .top-body{padding:0 16px 16px}
  .avatar-wrap{width:104px;height:104px;margin-top:-64px}
  .otw-label{font-size:8px;bottom:8px}
  .posts{grid-template-columns:minmax(0,1fr)}
  .otw-box{grid-template-columns:minmax(0,1fr)}
  .analytics{grid-template-columns:minmax(0,1fr)}
  .navlist .navitem:not(.keep){display:none}
  .fab .lbl{display:none}
  .fab.main{width:44px;padding:0;justify-content:center}
}
@media print{
  .nav,.dock,.ctrls,.edit-opts,.add-btn,aside{display:none!important}
  .wrap{grid-template-columns:1fr;margin:0}
  body{background:#fff}
  .clamp{display:block;-webkit-line-clamp:unset}.more{display:none}
}
</style>
</head>
<body>
<nav class="nav" aria-label="Hauptnavigation">
  <div class="nav-in" id="nav"></div>
</nav>
<div class="wrap" id="app">
  <main id="main"></main>
  <aside id="side"></aside>
</div>

<div class="modal-bg" id="modal" data-act="close-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal-inner"></div>
</div>

<div class="dock" id="dock">
  <div class="dock-menu" id="dock-menu">
    <button data-act="export"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg>Als JSON exportieren</button>
    <label><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 0L8 7m4-4 4 4M4 17v3h16v-3"/></svg>JSON importieren<input type="file" accept="application/json,.json" id="import-file" hidden></label>
    <button data-act="print"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 9V3h10v6M7 18H4v-8h16v8h-3M7 14h10v7H7z"/></svg>Drucken / als PDF</button>
    <button data-act="theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>Hell / Dunkel wechseln</button>
    <hr>
    <button data-act="reset" style="color:#cb112d"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/></svg>Auf Beispieldaten zurücksetzen</button>

/* ----------------------------- Render ------------------------------ */
function ctrls(list, i) {
  return `<div class="ctrls">
    <button data-act="up" data-list="${list}" data-i="${i}" title="Nach oben" aria-label="Nach oben">${I.up}</button>
    <button data-act="down" data-list="${list}" data-i="${i}" title="Nach unten" aria-label="Nach unten">${I.down}</button>
    <button class="del" data-act="del" data-list="${list}" data-i="${i}" title="Löschen" aria-label="Löschen">${I.trash}</button>
  </div>`;
}
const addBtn = list => `<button class="icon-btn add-btn" data-act="add" data-list="${list}" title="Eintrag hinzufügen" aria-label="Eintrag hinzufügen">${I.plus}</button>`;
const penBtn = `<button class="icon-btn" data-act="toggle-edit" aria-label="Bearbeiten">${I.pencil}</button>`;
function clampBlock(path, cls = '') {
  if (!has(path)) return '';
  return `<div class="clamp-wrap">${E(path, 'Beschreibung', 'div', `ml clamp ${cls}`)}</div>`;
}
function visible(key) { return S.sections[key] !== false; }
function secToggle(key) {
  return `<label class="sec-toggle edit-only"><input type="checkbox" data-sec="${key}" ${visible(key) ? 'checked' : ''}> anzeigen</label>`;
}
/* Rahmen einer Listen-Sektion */
function listSection(key, itemFn, opts = {}) {
  const list = S[key] || [];
  if (!editing && (!visible(key) || !list.length)) return '';
  const lim = LISTS[key].limit;
  const showAll = editing || !lim || expanded.has(key);
  const items = showAll ? list : list.slice(0, lim);
  const body = opts.wrap ? opts.wrap(items.map((it, i) => itemFn(it, i)).join('')) : `<ul class="list ${opts.cls || ''}">${items.map((it, i) => itemFn(it, i)).join('')}</ul>`;
  const foot = (!editing && lim && list.length > lim)
    ? `<button class="sec-foot" data-act="expand" data-list="${key}">${expanded.has(key) ? 'Weniger anzeigen' : `${opts.allLabel ? opts.allLabel(list.length) : `Alle ${list.length} anzeigen`}`} ${I.arrow}</button>` : (opts.foot || '');
  return `<section class="card ${!visible(key) ? 'hidden-sec' : ''}" aria-label="${esc(LISTS[key].title)}">
    <div class="pad">
      <div class="sec-h"><h2>${esc(LISTS[key].title)}</h2><div style="display:flex;align-items:center">${secToggle(key)}${addBtn(key)}${opts.headExtra || (editing ? '' : penBtn)}</div></div>
      ${opts.sub || ''}
      ${body}
    </div>${foot}
  </section>`;
}

      ${row(I.link.replace(/16/g, '24'), 'Ihr Profil', 'contact.url', true)}
      ${row(I.globe.replace(/16/g, '24'), 'Website', 'contact.website', true)}
      ${row(I.phone, 'Telefon', 'contact.phone')}
      ${row(I.mail, 'E-Mail', 'contact.email', true)}
      ${row(I.cake, 'Geburtstag', 'contact.birthday')}
    </div>`;
}

function render() {
  document.body.classList.toggle('editing', editing);
  document.getElementById('dock').classList.toggle('editing-flag', editing);
  document.getElementById('edit-btn').innerHTML = editing
    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg><span class="lbl">Fertig</span>`
    : `${I.pencil.replace(/24/g, '18')}<span class="lbl">Bearbeiten</span>`;
  renderNav();
  document.getElementById('main').innerHTML = [
    renderTop(), renderAnalytics(), renderAbout(), renderFeatured(), renderActivity(),
    renderExperience(), renderEducation(), renderCerts(), renderProjects(), renderVolunteering(),
    renderSkills(), renderRecos(), renderLanguages(), renderInterests()
  ].join('');
  renderSide();
  renderModal();
  document.title = S.name ? `${S.name} | Profil` : 'Profil-Mock';
  requestAnimationFrame(addMoreButtons);
}
function addMoreButtons() {
  if (editing) return;
  document.querySelectorAll('.clamp').forEach(el => {
    if (el.scrollHeight > el.clientHeight + 2 && !el.nextElementSibling?.classList.contains('more')) {
      el.insertAdjacentHTML('afterend', '<button class="more" data-act="more">…mehr anzeigen</button>');
    }
  });
}

/* ----------------------------- Events ------------------------------ */
document.addEventListener('input', e => {
  const el = e.target.closest('[data-path][contenteditable]');
  if (!el) return;
  setP(el.dataset.path, el.innerText.replace(/\n$/, ''));
  save();
  if (el.dataset.path === 'name') { renderNav(); }
});
document.addEventListener('paste', e => {
  const el = e.target.closest?.('[data-path][contenteditable]');
  if (!el || CE === 'plaintext-only') return;
  e.preventDefault();
  document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
});
document.addEventListener('keydown', e => {
  const el = e.target.closest?.('[data-path][contenteditable]');
  if (el && e.key === 'Enter' && !el.classList.contains('ml')) { e.preventDefault(); el.blur(); }
  if (e.key === 'Escape') document.getElementById('modal').classList.remove('on');
});
/* Nach dem Bearbeiten neu zeichnen (Logos, Initialen usw.) */
document.addEventListener('focusout', e => {
  if (e.target.closest?.('[data-path][contenteditable]')) setTimeout(() => {
    if (!document.activeElement?.closest?.('[data-path][contenteditable]')) { const y = scrollY; render(); scrollTo(0, y); }
  }, 0);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.bool) { S[t.dataset.bool] = t.checked; }
  else if (t.dataset.sec) { S.sections[t.dataset.sec] = t.checked; }
  else if (t.dataset.date) { setP(t.dataset.date, t.value); }
  else if (t.dataset.current) { setP(t.dataset.current, t.checked ? '' : new Date().toISOString().slice(0, 7)); }
  else return;
  save(true); const y = scrollY; render(); scrollTo(0, y);
});

let imgTarget = null;
const imgFile = document.getElementById('img-file');
const IMG_MAX = { avatar: [400, 400], banner: [1584, 396] };
imgFile.addEventListener('change', async () => {
  const f = imgFile.files[0]; imgFile.value = '';
  if (!f || !imgTarget) return;
  try {
    const [w, h] = IMG_MAX[imgTarget] || [800, 450];
    setP(imgTarget, await shrink(f, w, h));
    save(true); render();
  } catch (err) { toast('Bild konnte nicht geladen werden.'); }
});
function shrink(file, maxW, maxH) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        // Bild wird später per object-fit/cover beschnitten – daher auf die kürzere Zielseite skalieren
        const scale = Math.min(1, Math.max(maxW / im.width, maxH / im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * scale); c.height = Math.round(im.height * scale);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.86));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

document.getElementById('import-file').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { S = merge(clone(DEFAULT), JSON.parse(r.result)); save(true); render(); toast('Profil importiert.'); }
    catch (err) { toast('Die Datei ist kein gültiges Profil-JSON.'); }
  };
  r.readAsText(f);
});

document.addEventListener('click', e => {
  const imgEl = editing && e.target.closest('[data-img]');
  if (imgEl && !e.target.closest('[data-act],[data-path]')) { imgTarget = imgEl.dataset.img; imgFile.click(); return; }
  const a = e.target.closest('[data-act]');
  if (!a) { if (!e.target.closest('#dock')) document.getElementById('dock').classList.remove('open'); return; }
  const act = a.dataset.act, list = a.dataset.list, i = +a.dataset.i;
  const y = scrollY;
  switch (act) {
    case 'toggle-edit': editing = !editing; render(); scrollTo(0, y); toast(editing ? 'Bearbeitungsmodus: Klicken Sie auf beliebige Texte oder Bilder.' : 'Gespeichert.'); break;
    case 'add': S[list].push(LISTS[list].tpl()); save(true); render(); scrollTo(0, y); break;
    case 'del': if (confirm('Diesen Eintrag löschen?')) { S[list].splice(i, 1); save(true); render(); scrollTo(0, y); } break;
    case 'up': case 'down': {
      const j = act === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= S[list].length) break;
      [S[list][i], S[list][j]] = [S[list][j], S[list][i]]; save(true); render(); scrollTo(0, y); break;
    }
    case 'expand': expanded.has(list) ? expanded.delete(list) : expanded.add(list); render(); scrollTo(0, y); break;
    case 'more': a.previousElementSibling.classList.add('open'); a.remove(); break;
    case 'contact': document.getElementById('modal').classList.add('on'); break;
    case 'close-modal': if (a.id !== 'modal' || e.target === a) document.getElementById('modal').classList.remove('on'); break;
    case 'img-remove': setP(a.dataset.path, ''); save(true); render(); scrollTo(0, y); break;
    case 'menu': document.getElementById('dock').classList.toggle('open'); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'profil.json' });
      document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      break;
    }
    case 'print': document.getElementById('dock').classList.remove('open'); setTimeout(() => print(), 50); break;
    case 'theme': {
      const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem(THEME_KEY, next); } catch (err) {}
      break;
    }
    case 'reset':
      if (confirm('Alle Änderungen verwerfen und Beispieldaten laden? Exportieren Sie Ihr Profil vorher, wenn Sie es behalten möchten.')) {
        S = clone(DEFAULT); save(true); render(); document.getElementById('dock').classList.remove('open');
      }
      break;
  }
});

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

try { const th = localStorage.getItem(THEME_KEY); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
render();
})();
</script>
</body>
</html>
